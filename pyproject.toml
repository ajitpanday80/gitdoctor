[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitdoctor"
dynamic = ["version"]
description = "Health check for every git repo on your machine: leaked secrets, stale branches, unpushed work."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "secrets", "security", "cli", "devtools", "hygiene"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ajitpanday80/something"
Issues = "https://github.com/ajitpanday80/something/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gitdoctor = "gitdoctor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gitdoctor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
