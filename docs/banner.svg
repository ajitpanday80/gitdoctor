<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="gitdoctor: a health check for every git repo on your machine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1233"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ce99a"/><stop offset="1" stop-color="#74b9ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d4ff"/><stop offset="1" stop-color="#8cc8ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <g opacity=".08" stroke="#fff"><path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/></g>

  <text x="80" y="170" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="84" font-weight="700" fill="url(#title)">gitdoctor</text>
  <text x="84" y="222" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#c9d1d9">A health check for every git repo on your machine.</text>
  <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" fill="#8b949e">
    <text x="84" y="272"><tspan fill="#ff6b6b">✖</tspan> leaked secrets   <tspan fill="#ffd479">⚠</tspan> stale branches   <tspan fill="#74b9ff">●</tspan> unpushed work</text>
    <text x="84" y="306">zero dependencies · read-only · one command</text>
  </g>

  <g transform="translate(1030 180)">
    <circle r="105" fill="none" stroke="#21262d" stroke-width="18"/>
    <circle r="105" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="660" stroke-dashoffset="26" transform="rotate(-90)"/>
    <text y="14" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#e6edf3">96</text>
    <text y="48" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="18" fill="#8ce99a">grade A</text>
  </g>
</svg>
